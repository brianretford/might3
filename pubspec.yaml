name: might3
description: A Flutter app with transparent desktop widget, iPhone widget, Supabase, and Beads database
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Desktop
  cupertino_icons: ^1.0.6
  window_manager: ^0.3.7
  bitsdojo_window: ^0.1.6
  
  # Backend & Database
  supabase_flutter: ^2.0.0
  http: ^1.1.0
  
  # State Management & Utils
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1
  
  # JSON & Serialization
  json_annotation: ^4.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.6
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/
    
  fonts:
    - family: SF Pro
      fonts:
        - asset: fonts/SFPro-Regular.ttf
